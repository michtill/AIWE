name: ${AIWE_INSTANCE:-aiwe}
services:
  web:
    build: {context: ., target: studio}
    ports: ["${AIWE_BIND_ADDRESS:-127.0.0.1}:${AIWE_STUDIO_PORT:-8080}:8080"]
    environment:
      AIWE_ORIGIN: ${AIWE_ORIGIN:-http://127.0.0.1:8080}
      AIWE_PREVIEW_URL: ${AIWE_PREVIEW_URL:-http://127.0.0.1:8081/}
      AIWE_UI_LANGUAGE: ${AIWE_UI_LANGUAGE:-en}
      AIWE_PUBLISH_URL: ${AIWE_PUBLISH_URL:-}
      AIWE_PUBLISH_TOKEN: ${AIWE_PUBLISH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: ["aiwe_data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 192
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  preview:
    build: {context: ., target: studio}
    command: [node, src/preview.ts]
    ports: ["${AIWE_BIND_ADDRESS:-127.0.0.1}:${AIWE_PREVIEW_PORT:-8081}:8080"]
    volumes: ["aiwe_data:/data:ro"]
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 24
    restart: unless-stopped
  publisher:
    profiles: [publish]
    build: {context: ., dockerfile: deploy/publisher.Dockerfile}
    environment:
      PORT: 8080
      AIWE_DATA_DIR: /data
      AIWE_PUBLISH_TOKEN: ${AIWE_PUBLISH_TOKEN:-}
      AIWE_PRODUCTION_GIT: /production/repository.git
      AIWE_PRODUCTION_DIRECTORY: /production/www
      AIWE_PRODUCTION_URL: ${AIWE_PRODUCTION_URL:-http://production/}
    volumes: ["aiwe_data:/data:ro", "aiwe_production:/production"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 32
    restart: unless-stopped
  production:
    profiles: [publish]
    image: nginx:stable-alpine
    ports: ["${AIWE_BIND_ADDRESS:-127.0.0.1}:${AIWE_PRODUCTION_PORT:-8082}:80"]
    volumes: ["aiwe_production:/srv/aiwe:ro", "./deploy/production-nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    restart: unless-stopped
volumes:
  aiwe_data:
  aiwe_production:
