name: ${SITETILLER_INSTANCE:-sitetiller}
services:
  web:
    build: {context: ., target: studio}
    ports: ["${SITETILLER_BIND_ADDRESS:-127.0.0.1}:${SITETILLER_STUDIO_PORT:-8080}:8080"]
    environment:
      SITETILLER_SITE_URL: ${SITETILLER_SITE_URL:-}
      SITETILLER_ORIGIN: ${SITETILLER_ORIGIN:-http://127.0.0.1:8080}
      SITETILLER_PREVIEW_URL: ${SITETILLER_PREVIEW_URL:-http://127.0.0.1:8081/}
      SITETILLER_UI_LANGUAGE: ${SITETILLER_UI_LANGUAGE:-en}
      SITETILLER_PUBLISH_URL: ${SITETILLER_PUBLISH_URL:-}
      SITETILLER_PUBLISH_TOKEN: ${SITETILLER_PUBLISH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: ["sitetiller_data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 192
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  preview:
    build: {context: ., target: studio}
    command: [node, src/preview.ts]
    ports: ["${SITETILLER_BIND_ADDRESS:-127.0.0.1}:${SITETILLER_PREVIEW_PORT:-8081}:8080"]
    volumes: ["sitetiller_data:/data:ro"]
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 24
    restart: unless-stopped
  publisher:
    profiles: [publish]
    build: {context: ., dockerfile: deploy/publisher.Dockerfile}
    environment:
      PORT: 8080
      SITETILLER_DATA_DIR: /data
      SITETILLER_PUBLISH_TOKEN: ${SITETILLER_PUBLISH_TOKEN:-}
      SITETILLER_PRODUCTION_GIT: /production/repository.git
      SITETILLER_PRODUCTION_SNAPSHOT: ${SITETILLER_PRODUCTION_SNAPSHOT:-0}
      SITETILLER_PRODUCTION_DIRECTORY: /production/www
      SITETILLER_PRODUCTION_URL: ${SITETILLER_PRODUCTION_URL:-http://production/}
      SITETILLER_SITE_URL: ${SITETILLER_SITE_URL:-}
    volumes: ["sitetiller_data:/data:ro", "sitetiller_production:/production"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 32
    restart: unless-stopped
  production:
    profiles: [publish]
    image: nginx:stable-alpine
    ports: ["${SITETILLER_BIND_ADDRESS:-127.0.0.1}:${SITETILLER_PRODUCTION_PORT:-8082}:80"]
    volumes: ["sitetiller_production:/srv/sitetiller:ro", "./deploy/production-nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    restart: unless-stopped
volumes:
  sitetiller_data:
  sitetiller_production:
