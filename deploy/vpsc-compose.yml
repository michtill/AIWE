services:
  web:
    build:
      context: .
      target: studio
    ports: ["8080"]
    environment:
      SITETILLER_ORIGIN: ${SITETILLER_ORIGIN}
      SITETILLER_PREVIEW_URL: ${SITETILLER_PREVIEW_URL}
      SITETILLER_PUBLISH_URL: ${SITETILLER_PUBLISH_URL}
      SITETILLER_PUBLISH_TOKEN: ${SITETILLER_PUBLISH_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes: ["sitetiller_data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 192
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  preview:
    build:
      context: .
      target: studio
    command: ["node", "src/preview.ts"]
    ports: ["8080"]
    volumes: ["sitetiller_data:/data:ro"]
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.15
    pids_limit: 24
    restart: unless-stopped
volumes:
  sitetiller_data:
